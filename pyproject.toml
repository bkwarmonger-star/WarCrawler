[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-bastion-suite"
version = "0.1.0"
description = "Authorized purple-team security-testing suite (Aegis offensive + Bastion defensive) built around the WARCRAWLER crawler."
requires-python = ">=3.10"
dependencies = []   # cores are stdlib-only

[project.optional-dependencies]
# bastion/detection needs pySigma + backends
detection = [
  "pysigma>=0.11",
  "pysigma-backend-splunk",
  "pysigma-backend-elasticsearch",
  "pysigma-backend-kusto",
]
# aegis/discover authenticated JS-rendered crawl
discover = ["playwright>=1.40"]
dev = ["pytest>=7"]
full = ["aegis-bastion-suite[detection,discover,dev]"]

[tool.setuptools]
packages = [
  "common", "orchestrator",
  "aegis", "aegis.enrich", "aegis.recon_scan", "aegis.active", "aegis.discover",
  "aegis.report", "aegis.governance",
  "bastion", "bastion.detection", "bastion.posture_triage", "bastion.factory",
  "bridge",
]
# NOTE: wave-1..3 agents create the aegis.*/bastion.* subpackage dirs; this list is the target.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
